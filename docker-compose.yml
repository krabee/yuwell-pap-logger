# The InfluxDB service sits behind the `local-influx` profile, so:
#
#   docker compose --profile local-influx up -d   run everything here
#   docker compose up -d                          use an InfluxDB somewhere else
#
# In the second case, point INFLUX_URL/TOKEN/ORG/BUCKET in .env at that server. No
# other file needs to change.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SECRET_KEY: '${SECRET_KEY:?set SECRET_KEY in .env — generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"}'
    ports:
      - "8000:8000"
    volumes:
      # Accounts and the import ledger. Losing this means re-importing the SD card,
      # so it is a named volume rather than a container layer.
      - app-data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    profiles: ["local-influx"]
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:?set INFLUXDB_INIT_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?set INFLUXDB_INIT_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:?set INFLUX_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:?set INFLUX_BUCKET in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
      # 0 = keep forever. The whole point of this project is long-term history;
      # a year of one person's data is roughly 200k points.
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read by the provisioned datasource below, so Grafana and the app always
      # point at the same InfluxDB.
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  app-data:
  influx-data:
  influx-config:
  grafana-data:
