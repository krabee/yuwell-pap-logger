[project]
name = "yuwell-pap-logger"
version = "0.1.0"
description = "Long-term time-series logger for Yuwell YH550 CPAP/APAP .BYS session files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "influxdb-client>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.uv]
# SQLAlchemy pulls greenlet in for its asyncio support, which this project does not
# use. greenlet 3.5.5 ships no Linux wheel, so cap it rather than build from source.
constraint-dependencies = ["greenlet<3.5.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real .BYS files are never committed. Tests that need them are marked `realdata`
# and skip themselves when tests/fixtures/ is empty.
markers = [
    "realdata: requires real .BYS files in tests/fixtures/",
]
